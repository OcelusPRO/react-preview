<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previews</title>
    <style>
        :root { --bg-color: #f6f8fa; --text-color: #24292f; --box-bg: #ffffff; --border-color: #d0d7de; --link-color: #0969da; --hover-bg: #f3f4f6; --shadow: 0 1px 3px rgba(27,31,36,0.12); --shadow-hover: 0 4px 8px rgba(27,31,36,0.15); }
        [data-theme="dark"] { --bg-color: #0d1117; --text-color: #c9d1d9; --box-bg: #161b22; --border-color: #30363d; --link-color: #58a6ff; --hover-bg: #1f242c; --shadow: 0 1px 3px rgba(0,0,0,0.5); --shadow-hover: 0 4px 8px rgba(0,0,0,0.8); }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; line-height: 1.5; background-color: var(--bg-color); color: var(--text-color); max-width: 800px; margin: 0 auto; padding: 40px 20px; transition: background-color 0.2s, color 0.2s; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border-color); padding-bottom: 12px; margin-bottom: 24px; }
        h1 { margin: 0; font-size: 1.5rem; font-weight: 600; }
        code { background: var(--box-bg); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border-color); }
        button { background-color: var(--box-bg); color: var(--text-color); border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.9rem; font-weight: 500; transition: background-color 0.2s; }
        button:hover { background-color: var(--hover-bg); }
        ul { list-style: none; padding: 0; margin: 0; }
        li { background: var(--box-bg); margin: 12px 0; border-radius: 4px; border: 1px solid var(--border-color); box-shadow: var(--shadow); transition: transform 0.2s, box-shadow 0.2s; }
        li:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
        a { text-decoration: none; color: var(--link-color); font-weight: 600; display: block; padding: 16px; }
        .empty-state { padding: 16px; color: #8b949e; text-align: center; }
        .update-time { font-size: 0.8rem; color: #8b949e; margin-top: 32px; text-align: center; }
        .loader { text-align: center; padding: 20px; color: #8b949e; }
    </style>
    <script>
        const savedTheme = localStorage.getItem('theme');
        const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const initialTheme = savedTheme || (systemDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', initialTheme);
    </script>
</head>
<body>
<div class="header">
    <h1>Previews : <code id="base-path-display">...</code></h1>
    <button id="theme-btn">Changer de thème</button>
</div>

<ul id="branches-list">
    <li class="loader">Chargement des branches...</li>
</ul>

<div class="update-time" id="update-time"></div>

<script>
    document.getElementById('theme-btn').addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
    });

    // Le timestamp évite que le navigateur ne mette le JSON en cache
    fetch('branches.json?t=' + new Date().getTime())
        .then(response => response.json())
        .then(data => {
            document.getElementById('base-path-display').textContent = data.base_path;
            document.getElementById('update-time').textContent = 'Dernière mise à jour : ' + data.last_update;

            const list = document.getElementById('branches-list');
            list.innerHTML = '';

            if (!data.branches || data.branches.length === 0) {
                list.innerHTML = '<li class="empty-state">Aucune branche déployée pour le moment.</li>';
                return;
            }

            data.branches.forEach(branch => {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = branch.link;
                a.textContent = branch.name;
                li.appendChild(a);
                list.appendChild(li);
            });
        })
        .catch(err => {
            document.getElementById('branches-list').innerHTML = '<li class="empty-state">Erreur lors du chargement des données.</li>';
            console.error('Erreur:', err);
        });
</script>
</body>
</html>
